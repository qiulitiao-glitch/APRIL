[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "april-reproduction"
version = "1.0.0"
description = "In-request lookup and adaptive self-drafting reproduction"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.2.1", "transformers==4.45.2", "tokenizers==0.20.3",
  "huggingface-hub==0.36.0", "accelerate==1.0.1",
  "numpy==1.26.4", "sentencepiece==0.2.0", "protobuf==5.28.2",
  "safetensors==0.7.0", "PyYAML==6.0.3", "psutil==7.2.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
data = ["pyarrow==22.0.0", "sacrebleu==2.6.0"]

[tool.setuptools]
packages = ["april"]

[tool.pytest.ini_options]
testpaths = ["tests"]
